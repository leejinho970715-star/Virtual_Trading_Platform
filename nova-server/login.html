<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA Exchange — Private Access</title><meta name="description" content="실제 시장을 읽는 새로운 시선. NOVA 가상 투자 터미널."><link rel="icon" type="image/svg+xml" href="/nova-brand/favicon.svg"><meta property="og:title" content="NOVA Exchange"><meta property="og:description" content="REAL MARKETS. VIRTUAL CAPITAL. 실제 시장 데이터로 경험하는 가상 투자."><meta property="og:type" content="website"><meta property="og:url" content="https://virtual-trading-platform-rho.vercel.app/nova/"><meta property="og:image" content="https://virtual-trading-platform-rho.vercel.app/nova-brand/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://virtual-trading-platform-rho.vercel.app/nova-brand/og.jpg"><style>@font-face{font-family:Pretendard;src:url('/assets/fonts/PretendardVariable.woff2')}*{box-sizing:border-box}body{margin:0;background:#0b100b;color:#e4eadd;font:14px Pretendard,sans-serif;min-height:100dvh;display:grid;grid-template-columns:1.2fr 1fr}.visual{background:linear-gradient(0deg,#0b100b,transparent 60%),url('/nova-brand/og.jpg') center center/cover;min-height:100dvh;padding:45px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid #283121}.mark{display:flex;align-items:center;font-size:25px;gap:13px;font-weight:700;letter-spacing:1px}.mark img{width:34px}.visual p{font-size:12px;line-height:1.8;color:#94a68a}.access{display:flex;align-items:center;justify-content:center;padding:45px}.card{width:100%;max-width:370px}.eyebrow{font-size:10px;letter-spacing:2px;color:#a7c981}h1{font-size:36px;letter-spacing:-1px;font-weight:550;margin:18px 0}p{color:#8a9b7d;line-height:1.9;font-size:13px}label{display:block;margin:27px 0 9px;color:#becbb2;font-size:12px}input{display:block;width:100%;background:#11190e;border:1px solid #38462b;border-radius:8px;padding:14px 15px;color:#eff6e7;font:14px Pretendard}button{width:100%;padding:15px;margin-top:26px;background:#c3f06b;border:0;border-radius:8px;color:#18240d;font-weight:700;cursor:pointer}button:disabled{opacity:.5}input:focus-visible,button:focus-visible{outline:2px solid #c3f06b;outline-offset:3px}#error{color:#ed8f96;font-size:12px;min-height:22px}.note{border-top:1px solid #293322;padding-top:20px;margin-top:28px;font-size:10px;color:#718565}.status{display:flex;gap:8px;align-items:center;color:#a8c98a;font-size:10px}.status:before{content:'';width:5px;height:5px;background:#c3f06b;border-radius:50%}@media(max-width:800px){body{grid-template-columns:1fr}.visual{min-height:220px;padding:20px;background-position:center 45%}.visual p{display:none}.access{padding:32px 25px}h1{font-size:29px}.note{margin-top:20px}}</style></head><body><section class="visual"><div class="mark"><img src="/nova-brand/favicon.svg" alt="NOVA 로고">NOVA</div><p>REAL MARKETS. VIRTUAL CAPITAL.<br>실제 시장의 흐름, 나만의 투자 원칙.</p></section><main class="access"><div class="card"><span class="eyebrow">PRIVATE TRADING DESK</span><h1>당신의 시장으로.</h1><p>계정으로 로그인하고<br>NOVA 가상 투자 터미널에 입장하세요.</p><form id="login"><label for="username">아이디</label><input id="username" name="username" autocomplete="username" required maxlength="80"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button id="submit" type="submit">로그인</button><p id="error" role="alert"></p></form><div class="status">보호된 접속 · 가상 투자 전용</div><p class="note">실제 입출금과 금융 거래를 제공하지 않습니다.<br>(c) Designed By Eungyu Lee</p></div></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;error.textContent='';try{const response=await fetch('/nova/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await response.json();if(!response.ok)throw Error(data.error||'로그인에 실패했습니다.');document.getElementById('password').value='';location.replace('/nova/')}catch(e){error.textContent=e.message;button.disabled=false}};</script></body></html>
