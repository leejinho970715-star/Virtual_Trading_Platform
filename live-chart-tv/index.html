<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Chart TV</title><meta name="description" content="실시간으로 움직이는 모의 주식 차트와 호가를 경험하세요."><link rel="icon" href="../assets/favicon-32.png"><link rel="stylesheet" href="../terminal/terminal.css"><link rel="stylesheet" href="tv.css"><script type="module" src="../terminal/terminal.js"></script></head>
<body>
<main class="layout"><aside class="left"><section class="panel watch" id="watchlist"><div class="section-title"><h2>관심종목 <small>7</small></h2><span class="muted">KRW</span></div><div class="tabs" id="filters"><button class="active" data-filter="all">전체</button><button data-filter="up">상승</button><button data-filter="down">하락</button><button data-filter="held">보유</button></div><div id="stocks"></div><p class="empty" id="empty" hidden>조건에 맞는 종목이 없습니다.</p></section></aside>
<div class="center"><section class="panel chart-panel" id="chart"><div class="quote-head"><div><div class="identity"><h1 id="stock-name">셀프컴퍼니</h1><span id="stock-code">001001</span><span>KOSPI</span><span class="badge">AI · 플랫폼</span></div><div class="quote-line"><strong id="price">72,400</strong><span id="change"></span></div><span class="timestamp" id="clock"></span></div><dl class="ohlc"><div><dt>시가</dt><dd id="open"></dd></div><div><dt>고가</dt><dd id="high" class="up"></dd></div><div><dt>저가</dt><dd id="low" class="down"></dd></div><div><dt>거래량</dt><dd id="volume"></dd></div></dl></div><div class="toolbar"><div id="intervals"><button data-period="1">1분</button><button data-period="5">5분</button><button data-period="15">15분</button><button data-period="30">30분</button><button data-period="60">1시간</button><button class="active" data-period="day">일</button><button data-period="week">주</button></div><button id="indicators" class="quiet" aria-pressed="true">지표 켜짐</button><button id="pause" class="quiet">시세 일시정지</button></div><div class="chart-legend"><span class="ma5">MA5 <b id="ma5"></b></span><span class="ma20">MA20 <b id="ma20"></b></span><span class="ma60">MA60 <b id="ma60"></b></span><span id="chart-hint">마우스를 올려 시세를 확인하세요</span></div><div class="canvas-wrap"><canvas id="market-chart" role="img" aria-label="선택 종목의 모의 캔들 차트, 거래량, MACD 및 RSI"></canvas><div id="tooltip" hidden></div></div><div class="chart-bottom"><span class="live"><i></i> Live Chart TV · 모의 실시간</span><span>실제 시장 데이터가 아닌 모의 시세입니다</span></div></section>
</div>
<aside class="right"><section class="panel order"><div class="section-title"><h2 id="order-name">셀프컴퍼니</h2><span id="order-code">001001</span></div><div class="order-quote"><strong id="order-price"></strong><span id="order-change"></span></div><div class="trade-buttons"><button class="buy" data-trade="buy">매수</button><button class="sell" data-trade="sell">매도</button></div><div class="book-title"><h2>호가</h2><span class="muted">실시간 모의 주문</span></div><div class="book-labels"><span>매도잔량</span><span>호가 (KRW)</span><span>매수잔량</span></div><div id="orderbook"></div></section></aside></main>
<dialog id="trade-dialog"><form id="trade-form"><button class="close" type="button" id="close-dialog">닫기</button><span class="eyebrow">SIMULATED ORDER</span><h2 id="trade-title"></h2><p id="trade-price"></p><label>수량 (주)<input type="number" id="quantity" min="1" max="100000" step="1" value="1" required></label><p id="trade-total"></p><p id="trade-error" role="alert"></p><button type="submit" id="confirm-trade" class="buy">모의 주문 확인</button></form></dialog><div id="toast" role="status"></div><script src="tv.js"></script></body></html>
